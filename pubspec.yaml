name: gymrat
description: "GymRat - gamified fitness app."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  purchases_flutter: ^10.10.1
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/characters/male/
    - assets/characters/male/level_01/idle/
    - assets/characters/male/level_01/blink/
    - assets/characters/male/level_01/tail/
    - assets/characters/female/
    - assets/characters/non_binary/
    - assets/gyms/
    - assets/items/
    - assets/effects/
